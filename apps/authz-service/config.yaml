# authz-service — Local development configuration

server:
  port: 8082
  read_timeout: 10s
  write_timeout: 10s

grpc:
  port: 50051

database:
  url: "postgres://app_readwrite:dev@localhost:5433/sso_dev?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m

redis:
  url: "redis://localhost:6379/1"

openfga:
  api_url: "http://localhost:8080"
  store_id: ""

token:
  symmetric_key_hex: "ffbc7f3c3e91af9b148bb33eacea3716f276c217b4f15ca79ada72d03bb58666"

cache:
  l1_max_items: 10000
  l1_ttl: 5m
  l2_ttl: 15m

outbox:
  poll_interval: 2s
  batch_size: 50
