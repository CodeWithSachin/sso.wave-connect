# identity-service — Local development configuration
# Override any value via environment variables (e.g. DATABASE_URL, TOKEN_SYMMETRIC_KEY_HEX)

server:
  port: 3000
  read_timeout: 10s
  write_timeout: 10s

database:
  url: "postgres://app_readwrite:dev@localhost:5433/sso_dev?sslmode=disable"
  max_conns: 20
  min_conns: 5
  max_conn_lifetime: 30m

redis:
  url: "redis://localhost:6379/0"

token:
  symmetric_key_hex: "ffbc7f3c3e91af9b148bb33eacea3716f276c217b4f15ca79ada72d03bb58666"
  private_key_hex: "ee977c1f34c26defd4b453799b627c0b2e8cbb192aeb2a46bd19fb6f75c7494f95f62e52a17a01a0798804d80cc23a0f165889d91cefb728b807f339c9f06d67"
  issuer: "http://localhost:3000"
  access_ttl: 15m
  refresh_ttl: 720h
  id_ttl: 1h

argon2:
  memory: 65536
  iterations: 3
  parallelism: 4
  key_len: 32
  salt_len: 16
