# SAMPLE secret manifest — DO NOT commit a real `data:` block.
#
# Each environment overlay (dev/staging/prod) provides its own version of
# this manifest with the actual key material populated from KMS / Vault /
# sealed-secrets, never checked into git.
#
# The `OIDC_SECRET_KEY` is the AES-256-GCM envelope key used by both
# admin-api (writes encrypted IdP client secrets) and sso-service (reads
# them during external OIDC federation). The two services MUST reference
# the same Secret — drift between them produces a silent decrypt failure
# on every external-IdP sign-in.
#
# How to generate the value:
#   head -c 32 /dev/urandom | base64
#
# How to rotate (per docs/plans/execution-roadmap.md Track 6.1):
#   1. Add OIDC_SECRET_KEY_V2 alongside OIDC_SECRET_KEY (now v1) in the Secret.
#   2. Roll admin-api + sso-service to pick up both keys.
#   3. The lazy re-encrypt job (admin-api scheduler) rewrites v1 rows to v2.
#   4. Once zero v1 rows remain, drop OIDC_SECRET_KEY (the v1 key) and roll.

apiVersion: v1
kind: Secret
metadata:
  name: sso-oidc-secret-key
  namespace: sso-platform
type: Opaque
stringData:
  # 32 raw bytes, base64-encoded. Override per environment.
  OIDC_SECRET_KEY: "REPLACE_ME_DEV_ONLY_DO_NOT_USE_IN_PROD"
  # Uncomment during rotation transitions only:
  # OIDC_SECRET_KEY_V2: "REPLACE_ME"

---
# Reference pattern for the two Deployments. Add to admin-api/deployment.yaml
# AND sso-service/deployment.yaml under spec.template.spec.containers[*].env.
#
# - name: OIDC_SECRET_KEY
#   valueFrom:
#     secretKeyRef:
#       name: sso-oidc-secret-key
#       key: OIDC_SECRET_KEY
# - name: OIDC_SECRET_KEY_V2          # rotation transitions only
#   valueFrom:
#     secretKeyRef:
#       name: sso-oidc-secret-key
#       key: OIDC_SECRET_KEY_V2
#       optional: true
