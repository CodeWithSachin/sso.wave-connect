apiVersion: apps/v1
kind: Deployment
metadata: { name: admin-api, namespace: sso-platform, labels: { app: admin-api, tier: platform } }
spec:
  replicas: 2
  selector: { matchLabels: { app: admin-api } }
  template:
    metadata: { labels: { app: admin-api, tier: platform } }
    spec:
      containers:
        - name: admin-api
          image: sso-platform/admin-apiatest
          ports: [{ containerPort: 3100, name: http }]
          envFrom: [{ configMapRef: { name: sso-config } }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 5 }
