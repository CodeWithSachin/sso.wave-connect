apiVersion: apps/v1
kind: Deployment
metadata: { name: pgbouncer, namespace: sso-platform }
spec:
  replicas: 2
  selector: { matchLabels: { app: pgbouncer } }
  template:
    metadata: { labels: { app: pgbouncer } }
    spec:
      containers:
        - name: pgbouncer
          image: bitnami/pgbouncer:1.23.1
          ports: [{ containerPort: 6432, name: pgbouncer }]
          env:
            - { name: POSTGRESQL_HOST, value: postgres }
            - { name: POSTGRESQL_PORT, value: "5432" }
            - { name: POSTGRESQL_DATABASE, value: sso_dev }
            - { name: POSTGRESQL_USERNAME, value: app_readwrite }
            - { name: PGBOUNCER_POOL_MODE, value: transaction }
            - { name: PGBOUNCER_MAX_CLIENT_CONN, value: "10000" }
            - { name: PGBOUNCER_DEFAULT_POOL_SIZE, value: "50" }
            - { name: PGBOUNCER_MIN_POOL_SIZE, value: "10" }
          envFrom:
            - secretRef:
                name: pgbouncer-secrets
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            tcpSocket: { port: 6432 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: pgbouncer, namespace: sso-platform }
spec:
  selector: { app: pgbouncer }
  ports: [{ name: pg, port: 5432, targetPort: 6432 }]
