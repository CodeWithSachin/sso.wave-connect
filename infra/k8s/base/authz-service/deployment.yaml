apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz-service
  namespace: sso-platform
  labels: { app: authz-service, tier: hot-path }
spec:
  replicas: 5
  selector:
    matchLabels: { app: authz-service }
  template:
    metadata:
      labels: { app: authz-service, tier: hot-path }
    spec:
      containers:
        - name: authz-service
          image: sso-platform/authz-service:latest
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 50051, name: grpc }
          envFrom: [{ configMapRef: { name: sso-config } }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 3 }
