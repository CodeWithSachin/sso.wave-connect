apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: authz-service, namespace: sso-platform }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: authz-service }
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
