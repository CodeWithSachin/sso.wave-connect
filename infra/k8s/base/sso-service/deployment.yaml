apiVersion: apps/v1
kind: Deployment
metadata: { name: sso-service, namespace: sso-platform, labels: { app: sso-service, tier: hot-path } }
spec:
  replicas: 3
  selector: { matchLabels: { app: sso-service } }
  template:
    metadata: { labels: { app: sso-service, tier: hot-path } }
    spec:
      containers:
        - name: sso-service
          image: sso-platform/sso-service:latest
          ports: [{ containerPort: 8083, name: http }]
          envFrom: [{ configMapRef: { name: sso-config } }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 3 }
