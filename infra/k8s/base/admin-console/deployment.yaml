apiVersion: apps/v1
kind: Deployment
metadata: { name: admin-console, namespace: sso-platform, labels: { app: admin-console, tier: frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: admin-console } }
  template:
    metadata: { labels: { app: admin-console, tier: frontend } }
    spec:
      containers:
        - name: admin-console
          image: sso-platform/admin-consoleatest
          ports: [{ containerPort: 80, name: http }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3 }
