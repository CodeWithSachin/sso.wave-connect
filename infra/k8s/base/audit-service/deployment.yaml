apiVersion: apps/v1
kind: Deployment
metadata: { name: audit-service, namespace: sso-platform, labels: { app: audit-service, tier: platform } }
spec:
  replicas: 2
  selector: { matchLabels: { app: audit-service } }
  template:
    metadata: { labels: { app: audit-service, tier: platform } }
    spec:
      containers:
        - name: audit-service
          image: sso-platform/audit-serviceatest
          ports: [{ containerPort: 3400, name: http }]
          envFrom: [{ configMapRef: { name: sso-config } }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 5 }
