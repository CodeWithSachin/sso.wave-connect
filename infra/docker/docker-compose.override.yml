# Observability stack — extends the base docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d

services:
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: sso-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
      - "4317:4317"     # OTLP gRPC receiver
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: sso-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: sso-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3500:3000"     # Grafana on 3500 (3000 used by identity-service)
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
