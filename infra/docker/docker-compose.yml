services:
  postgres:
    image: postgres:16-alpine
    container_name: sso-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sso_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sso-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  openfga:
    image: openfga/openfga:latest
    container_name: sso-openfga
    restart: unless-stopped
    ports:
      - '8080:8080'   # HTTP API
      - '8081:8081'   # gRPC API
      - '2112:2112'   # Metrics
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:postgres@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    command: run
    healthcheck:
      test: ['CMD', '/usr/local/bin/grpc_health_probe', '-addr=:8081']
      interval: 5s
      timeout: 5s
      retries: 5

  openfga-migrate:
    image: openfga/openfga:latest
    container_name: sso-openfga-migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://postgres:postgres@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: migrate

  nats:
    image: nats:2-alpine
    container_name: sso-nats
    restart: unless-stopped
    ports:
      - '4222:4222'   # Client
      - '8222:8222'   # Monitoring
    command: '-js -m 8222'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8222/healthz']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
